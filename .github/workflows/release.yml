name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Repository checks
        run: npm run check

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          test "$GITHUB_REF_NAME" = "v$package_version"

      - name: Build source archives
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          git archive --format=zip --prefix="jev-mcp-${version}/" \
            --output="release-assets/jev-mcp-${version}.zip" "$GITHUB_REF_NAME"
          git archive --format=tar.gz --prefix="jev-mcp-${version}/" \
            --output="release-assets/jev-mcp-${version}.tar.gz" "$GITHUB_REF_NAME"
          sha256sum release-assets/jev-mcp-* > release-assets/SHA256SUMS.txt
          awk -v version="$version" '
            $0 ~ "^## " version { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-assets/RELEASE_NOTES.md
          test -s release-assets/RELEASE_NOTES.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/jev-mcp-*.zip \
            release-assets/jev-mcp-*.tar.gz \
            release-assets/SHA256SUMS.txt \
            --verify-tag \
            --notes-file release-assets/RELEASE_NOTES.md \
            --title "$GITHUB_REF_NAME"
