name: Bug report
description: Report reproducible behavior in jev-mcp
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste API keys, tokens, proprietary source code, customer data, or other secrets.
  - type: input
    id: version
    attributes:
      label: jev-mcp version
      placeholder: 0.4.1
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: v20.x / v22.x / v24.x
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: MCP host/client
      placeholder: Codex CLI, VS Code extension, other MCP host
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Use redacted inputs only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / redacted logs
    validations:
      required: true
  - type: checkboxes
    id: secrets
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, secrets, customer data, and unrelated proprietary code.
          required: true
