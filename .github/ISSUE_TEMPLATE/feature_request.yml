name: Feature request
description: Suggest a focused improvement
title: "[feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation are you trying to address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: checkboxes
    id: invariants
    attributes:
      label: Conservative design
      options:
        - label: The proposal keeps Jev advisory rather than authoritative.
          required: true
        - label: The proposal does not require committing credentials.
          required: true
